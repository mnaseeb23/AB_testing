services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: jackets_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress_secure_pass_2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_pass_2026}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - jackets_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD:-root_secure_pass_2026} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  # WordPress Application Service with WP-CLI & Custom Theme
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jackets_wordpress
    restart: unless-stopped
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress_secure_pass_2026}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: 1
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-AdminPassword2026!}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@leatherjackethouse.com}
      WP_SITE_URL: ${WP_SITE_URL:-http://localhost:8080}
      WP_SITE_TITLE: ${WP_SITE_TITLE:-Leather Jacket House}
      WP_TAGLINE: ${WP_TAGLINE:-Premium Leather Jackets for Every Style}
      WC_CURRENCY: ${WC_CURRENCY:-USD}
    volumes:
      - ./wp-content/themes/leather-jacket-house:/var/www/html/wp-content/themes/leather-jacket-house
      - ./wp-cli:/wp-cli
      - ./sample-data:/sample-data
      - wp_data:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - jackets_net

  # phpMyAdmin Database Management Interface
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: jackets_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_pass_2026}
      UPLOAD_LIMIT: 128M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - jackets_net

volumes:
  db_data:
    driver: local
  wp_data:
    driver: local

networks:
  jackets_net:
    driver: bridge
